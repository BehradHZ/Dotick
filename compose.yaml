name: dotick

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: dotick
      POSTGRES_DB: dotick_dev
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "127.0.0.1:${PGPORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotick -d dotick_dev"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data: