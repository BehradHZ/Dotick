name: dotick
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: dotick
      POSTGRES_DB: dotick_dev
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env before starting Compose}
    ports:
      - '127.0.0.1:${PGPORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dotick -d dotick_dev']
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
  web:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    ports:
      - '127.0.0.1:8081:8080'
volumes:
  postgres_data:
