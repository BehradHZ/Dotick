name: One-time licensing documentation reconciliation

on:
  push:
    branches:
      - test
    paths:
      - .github/workflows/one-time-licensing-doc-rewrite.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0

      - name: Rewrite documentation
        run: python scripts/one_time_licensing_rewrite.py

      - name: Validate and commit
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-licensing-doc-rewrite.yml
          rm scripts/one_time_licensing_rewrite.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs .github/workflows/one-time-licensing-doc-rewrite.yml scripts/one_time_licensing_rewrite.py
          git diff --cached --check
          git commit -m "docs: adopt open-source paid-services model"
          git push origin HEAD:test
