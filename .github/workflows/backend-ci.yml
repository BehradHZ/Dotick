name: Backend CI

# Runs the backend test suite against a real PostgreSQL service container
# (not sqlite), matching ROADMAP.md §3's choice of PostgreSQL and the
# project's stated policy of always testing against Postgres
# (see backend/README.md "Running tests").

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: Django tests (Postgres)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dotick
          POSTGRES_PASSWORD: dotick
          POSTGRES_DB: dotick
        ports:
          - 5432:5432
        # Wait for Postgres to report healthy before the job proceeds,
        # so `manage.py test` doesn't race a still-starting container.
        options: >-
          --health-cmd "pg_isready -U dotick"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DOTICK_DB_NAME: dotick
      DOTICK_DB_USER: dotick
      DOTICK_DB_PASSWORD: dotick
      DOTICK_DB_HOST: localhost
      DOTICK_DB_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run test suite
        run: python manage.py test
