name: Reconcile future AI product documents

on:
  push:
    branches: [test]
    paths:
      - .github/workflows/reconcile-future-ai-docs.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0

      - name: Reconcile canonical and planning documents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def insert_before(path, marker, block):
              text = read(path)
              if block.strip() in text:
                  return
              if marker not in text:
                  raise RuntimeError(f"marker not found in {path}: {marker[:80]!r}")
              write(path, text.replace(marker, block.rstrip() + "\n\n" + marker, 1))

          # ------------------------------------------------------------------
          # System Definition — canonical Future product direction + invariant
          # ------------------------------------------------------------------
          sd_path = "docs/requirements/system-definition.md"
          sd = read(sd_path)

          principle = r'''### 5.4.8 Stable Core and Future AI Experience/Agent Surfaces

          Dotick's product meaning must remain independent from the specific interface surface through which an action is reached. A default UI, a future AI-generated experience, or a future built-in AI Agent may present or initiate the same supported capability differently, but none of those surfaces may redefine the domain meaning of that capability or bypass Dotick's authorization, validation, History/Undo, Sync, or data-integrity rules.

          Future AI-generated presentation is therefore an experience layer over the Dotick core rather than an alternate source of truth. Likewise, future Agent authority is an explicitly User-granted way to invoke Dotick capabilities, not a privileged database or business-logic bypass.

          Current implementation is not required to build the future Agent Runtime or Generative Experience Runtime early. It must only avoid unnecessary coupling of core business behavior to one specific layout, theme, component tree, or human-only calling path when the same behavior can remain behind an authoritative application/domain boundary.'''

          marker = "# 6. Functional Capabilities"
          if "### 5.4.8 Stable Core and Future AI Experience/Agent Surfaces" not in sd:
              if marker not in sd:
                  raise RuntimeError("System Definition section-6 marker missing")
              sd = sd.replace(marker, principle + "\n\n---\n\n" + marker, 1)

          future_block = r'''### Built-in AI Agent

          A built-in Dotick AI Agent is a Planned Future Capability distinct from external-agent integrations. The User will choose the Agent's authority through a small set of understandable profiles rather than being forced to configure a large low-level permission matrix for ordinary use.

          The confirmed conceptual authority profiles are `Observe`, `Ask`, `Assist`, and `Autonomous`. Their exact capability mapping belongs to Future Agent Design. Where applicable, authority may be granted for `Once`, `This session`, or persistently until revoked (`Always`).

          Regardless of profile, Agent operations must pass through the same authoritative Dotick domain/application rules as equivalent User operations. The Agent must not receive a direct privileged path around authorization, validation, atomicity, Sync, History, Audit, or data-integrity safeguards. If an operation is undoable when initiated manually, the equivalent Agent-initiated operation remains subject to the same Core Undo semantics. Caller origin may be recorded for traceability without changing the operation's domain meaning.

          ### Generative Experience Layer

          Dotick has a Planned Future direction in which the User may describe a desired product experience and choose how far it may depart from the current interface. The conceptual transformation levels are `Recolor`, `Restyle`, `Transform`, and `Reimagine`, ranging from token/color changes through component/motion changes to substantial layout, navigation-presentation, and interaction changes.

          Generated experiences may alter appearance, motion, sound, component composition, layout, navigation presentation, and restricted interaction metaphors, but required product capabilities must remain reachable and core domain semantics must remain unchanged.

          The generated experience must be represented by a constrained declarative Experience Specification interpreted by Dotick. It must not require the client to execute unrestricted AI-generated JavaScript, React/native code, unrestricted CSS, or another arbitrary executable program as a theme. The exact Experience DSL/schema and renderer are Future Design concerns.

          Experience generation is not part of the ordinary interaction loop. A generated/edited/adapted experience is validated and versioned, then ordinary interactions execute through the local/runtime interpretation of that validated experience. AI is invoked again when generation, editing, repair, or device/form-factor adaptation is requested.

          Before a generated or adapted experience can be applied on a device, the intended future validation flow includes deterministic structural/capability validation, repair when safe, functional simulation against representative synthetic Dotick state, the applicable accessibility checks for the release that ships the feature, AI UX review for concerns that are not reliably rule-based, and a fully interactive synthetic-data Preview in which the User can exercise important workflows before Apply.

          A generated experience finalized on one device is not silently activated on another device. Another device may offer to adapt that experience for its own form factor/capabilities; adaptation reuses the existing experience where practical and must again pass validation and interactive Preview before the User applies it.

          Generated experiences must also have a protected recovery path to a known-good/default experience that the generated experience itself cannot remove or redefine. Experience versions may be shared through a controlled link/file/package mechanism in the future, but a received experience still requires local validation before Apply. Asset provenance, licensing/IP, integrity, safety, and trust rules for generated, User-provided, or external assets belong to Future Design.

          ### Late Future Generated Extensions

          A later Future phase may allow bounded extension-specific state or rules associated with an experience, such as a progression metaphor driven by real Dotick activity. This is intentionally separate from the initial Generative Experience Runtime. Future Design may introduce bounded concepts such as `Extension State`, `Extension Events`, `Extension UI`, and `Extension Rules`, but current implementation must not create a general arbitrary-code extension engine merely to anticipate that phase. Extension behavior must remain sandboxed and must never become an alternate source of truth for core Dotick domain or authorization semantics.'''

          licensing_marker = "Dotick's software-licensing model is finalized:"
          if "### Built-in AI Agent" not in sd:
              if licensing_marker not in sd:
                  raise RuntimeError("System Definition future licensing marker missing")
              sd = sd.replace(licensing_marker, future_block + "\n\n" + licensing_marker, 1)

          glossary_rows = """| `Built-in AI Agent` | Future Dotick-operated agent that may inspect or invoke registered Dotick capabilities only within explicit User-granted authority; it does not receive a business-logic or persistence bypass. |\n| `Agent Authority Profile` | Future User-facing authority preset for the built-in Agent: conceptually Observe, Ask, Assist, or Autonomous, with exact capability mapping defined by Future Agent Design. |\n| `Generative Experience` | Future validated, versioned presentation/interaction layer generated or adapted from User intent while preserving required capabilities and core Dotick semantics. |\n| `Experience Specification` | Future constrained declarative description interpreted by Dotick to render a generated experience and map permitted interactions to registered product capabilities; it is not unrestricted executable client code. |\n"""
          ext_ai_row = "| `External AI Processing Control` | A global User setting that disables capabilities dependent on external AI processing without disabling core productivity behaviors that do not depend on AI. |\n"
          if "| `Generative Experience` |" not in sd:
              if ext_ai_row not in sd:
                  raise RuntimeError("System Definition glossary anchor missing")
              sd = sd.replace(ext_ai_row, ext_ai_row + glossary_rows, 1)

          write(sd_path, sd)

          # ------------------------------------------------------------------
          # Decision Register — rationale and product boundaries
          # ------------------------------------------------------------------
          dr_path = "docs/decision-register.md"
          dr = read(dr_path)
          decisions = r'''---

          ## DR-145 — Generative Experience is a Future presentation/runtime layer over a stable Dotick core

          **Status:** CONFIRMED AS FUTURE CAPABILITY

          ### Context and previous model

          Current Dotick theming is intentionally conventional: Increment 5 retains several predefined visual directions implemented from shared tokens/components. A broader Future vision now allows the User to describe an experience that may range from a simple recolor to a substantially reimagined interface with different layout, motion, navigation presentation, and interaction metaphors.

          Allowing a model to generate and execute arbitrary client code would make authorization, capability reachability, accessibility, recovery, deterministic behavior, and data integrity difficult to guarantee. Conversely, hard-coding every future visual concept would defeat the purpose of a generative experience system. Continuous LLM inference on every ordinary interaction would also add unnecessary cost, latency, nondeterminism, and online dependency.

          ### Decision

          - Generative Experience is a **Planned Future Capability** and is not a Personal V1 implementation requirement.
          - The User controls transformation distance through four conceptual levels: `Recolor`, `Restyle`, `Transform`, and `Reimagine`. Natural-language constraints may further restrict what changes.
          - A generated experience may change visual tokens, component presentation/composition, motion, sound, layout, navigation presentation, responsive behavior, and restricted interaction metaphors, provided required Dotick capabilities remain reachable.
          - Generated presentation must never redefine the meaning of Task/Event/Routine operations, authorization, recurrence, Sync, History/Undo, deletion, persistence, or other core domain rules.
          - The AI output for this capability is a constrained **declarative Experience Specification/DSL** interpreted by Dotick. Unrestricted AI-generated JavaScript, React/native code, unrestricted CSS, or other arbitrary executable client code is not the theme/runtime contract.
          - Ordinary UI interaction does not require a model round-trip. Experience versions are generated/edited/repaired/adapted, validated, persisted/versioned, and then interpreted by the runtime deterministically.
          - Before Apply on a device, a generated/adapted version passes a validation pipeline that includes deterministic schema/primitive/action checks, required-capability reachability checks, functional simulation against representative synthetic Dotick state, applicable accessibility checks for the release, AI UX review for non-rule-based quality concerns, and an interactive synthetic-data Preview.
          - Preview is interactive, not merely a screenshot. The User can traverse representative product surfaces and exercise important workflows without changing real Account data.
          - A generated experience created on one device does not automatically replace the active experience on another device. The target device offers explicit adaptation; adaptation reuses the existing specification where practical and again requires validation, Preview, and User Apply.
          - A protected recovery path to a known-good/default experience and previous valid version must remain reachable independently of the generated experience.
          - Experience packages may be shareable through a controlled link/file/package mechanism. A received experience is not trusted merely because it was shared and must pass local validation before Apply.
          - Generated, User-provided, or externally sourced assets may be supported under Future asset-provenance, licensing/IP, integrity, safety, caching, and trust policy.
          - A later capability may add bounded `Extension State`, `Extension Events`, `Extension UI`, and `Extension Rules`, but this is separate from the initial Generative Experience Runtime. Current implementation must not create a general arbitrary-code extension engine in anticipation of it.

          ### Implications

          - Increment 5's predefined themes remain Current-Scope presentation work; they are not replaced by a Generative Experience engine.
          - Current UI architecture should favor shared tokens/primitives/components and presentation-independent application actions so later generated presentation does not require extracting business logic from theme-specific components.
          - The full Experience DSL, renderer, validators, synthetic test workspace, Preview isolation, device adaptation, sharing format, asset policy, and extension sandbox remain Future Design Gates.
          - The current accessibility decision remains unchanged: exact conformance is Future. The future Generative Experience release must select and enforce its measurable accessibility baseline before shipping.

          ---

          ## DR-146 — Built-in AI Agent uses User-selected authority profiles and the ordinary Dotick capability boundary

          **Status:** CONFIRMED AS FUTURE CAPABILITY

          ### Context and previous model

          Dotick already anticipates future external agents and Trusted Automation, but an internal Dotick Agent is a distinct product capability. The desired UX is similar to modern coding agents: the User chooses how much authority the Agent receives instead of approving every operation unconditionally or granting unrestricted access.

          A separate privileged Agent mutation path would duplicate business rules and risk divergence from ordinary UI behavior. A large low-level permission matrix exposed directly to ordinary Users would also make authority difficult to understand.

          ### Decision

          - A built-in Dotick AI Agent is a **Planned Future Capability** distinct from external-agent integrations.
          - The ordinary User-facing authority model uses four conceptual presets: `Observe`, `Ask`, `Assist`, and `Autonomous`.
          - `Observe` is read-only within permitted context.
          - `Ask` may prepare/propose state changes but requires User confirmation before writes.
          - `Assist` may execute low-risk operations in granted scope while sensitive/destructive/protected actions follow confirmation policy.
          - `Autonomous` may act without per-action confirmation within the explicitly granted capability scope; non-overridable authorization, integrity, and safety constraints remain active.
          - Where applicable, authority may be granted for `Once`, `This session`, or persistently until revoked (`Always`). Persistent grants are revocable.
          - The exact low-level capability matrix and classification of low-risk/sensitive/destructive operations belong to Future Agent Design rather than being hard-coded by this decision.
          - Agent operations must use the same authoritative application/domain capability path as equivalent User operations. Agent execution must not directly mutate persistence, bypass authorization, skip domain validation, or create alternate Task/Event/Routine semantics.
          - History/Audit may record Agent origin, but caller origin does not change the business meaning of an operation.
          - Core Undo is origin-neutral. If a planning/productivity mutation is undoable when performed by the User, the equivalent Agent-initiated operation remains subject to the same Undo/recovery semantics.
          - User-selected confirmation policy may relax confirmations only where Future Agent policy permits. It does not disable non-overridable safeguards required by authorization, atomicity, data integrity, or other product invariants.

          ### Implications

          - Current application/domain services should remain actor-aware and presentation-independent; UI code must not become the only place where important mutation rules exist.
          - Current increments do not need Agent tables, Agent permission persistence, an Agent tool protocol, or a general Capability Gateway merely to anticipate this Future capability.
          - Before Agent implementation, Future Design must define the capability map, sensitive/destructive classification, grant persistence/revocation, Once/Session/Always lifecycle, confirmation UX, origin/audit representation, failure behavior, and privacy/external-AI context rules.
          - External agents remain governed by their separate integration boundary; confirming a built-in Agent does not create a public general-purpose API.

          '''
          coverage_marker = "# Decision coverage and remaining design handoff"
          if "## DR-145 — Generative Experience" not in dr:
              if coverage_marker not in dr:
                  raise RuntimeError("Decision Register coverage marker missing")
              dr = dr.replace(coverage_marker, decisions + coverage_marker, 1)
          write(dr_path, dr)

          # ------------------------------------------------------------------
          # SRS — Future direction only; Personal V1 normative IDs unchanged
          # ------------------------------------------------------------------
          srs_path = "docs/requirements/srs.md"
          srs = read(srs_path)
          srs = srs.replace("**Version:** 3.0", "**Version:** 3.1", 1)
          if "| 3.1 | 2026-09-18 | AI Agent & Generative Experience Future Direction |" not in srs:
              pattern = r'(^\| 3\.0 \|[^\n]*\n)'
              repl = r'\1| 3.1 | 2026-09-18 | AI Agent & Generative Experience Future Direction | ثبت Built-in Agent، User-selected authority profiles، Generative Experience/DSL، validation + interactive Preview، cross-device adaptation و late generated extensions به‌عنوان Future Direction بدون افزودن requirement جاری به Personal V1. |\n'
              srs, n = re.subn(pattern, repl, srs, count=1, flags=re.MULTILINE)
              if n != 1:
                  raise RuntimeError("SRS 3.0 history row not found")

          srs_future = r'''### 8.1.1 Built-in AI Agent and Generative Experience

          علاوه بر external-agent integration، یک **Built-in Dotick AI Agent** نیز Planned Future Direction است. Agent آینده از authority profileهای محدود و قابل‌فهم `Observe / Ask / Assist / Autonomous` استفاده می‌کند و grant در صورت کاربرد می‌تواند `Once / This session / Always-until-revoked` باشد. Agent برای mutation مسیر privileged جداگانه ندارد و عملیاتش باید همان authorization، validation، domain rule، History/Audit و Undo semantics عملیات معادل User را طی کند. جزئیات capability matrix و sensitive/destructive classification متعلق به Future Agent Design است.

          **Generative Experience** نیز Planned Future Direction است. User می‌تواند فاصله از UI پایه را در سطح‌های مفهومی `Recolor / Restyle / Transform / Reimagine` کنترل کند. خروجی AI یک Experience Specification/DSL محدود و declarative است که Dotick آن را تفسیر می‌کند؛ اجرای unrestricted AI-generated JavaScript/React/native code/CSS به‌عنوان theme contract این جهت محصول نیست.

          Generated Experience می‌تواند presentation، layout، motion، component composition، navigation presentation و interaction metaphorهای مجاز را تغییر دهد، اما capabilityهای لازم باید reachable بمانند و معنای domain actionها تغییر نکند. generation در normal interaction loop انجام نمی‌شود؛ نسخه‌ی تولید/ویرایش/repair/adaptشده پس از validation به‌صورت versioned اجرا می‌شود.

          پیش از Apply روی هر device، Future implementation باید structural/capability validation، functional simulation روی synthetic state، accessibility checks مطابق baseline همان Future release، AI UX review و interactive synthetic-data Preview را طی کند. experience ساخته‌شده روی یک device روی device دیگر auto-apply نمی‌شود؛ User صراحتاً adaptation برای form factor جدید را انتخاب می‌کند و variant جدید نیز validation + Preview + Apply مستقل دارد.

          یک فاز دیرتر ممکن است bounded `Extension State / Events / UI / Rules` را اضافه کند. این capability جدا از initial Generative Experience Runtime است و هیچ current requirement برای ساخت extension engine ایجاد نمی‌کند.

          جزئیات canonical/rationale این Future direction در DR-145 و DR-146 و design vision در `docs/requirements/future-ai-agent-experience.md` ثبت شده است. این subsection requirement ID جدیدی برای Personal V1 ایجاد نمی‌کند.'''
          srs_marker = "## 8.2 Explicitly Out of Scope and Not Currently Planned as Future Commitments"
          if "### 8.1.1 Built-in AI Agent and Generative Experience" not in srs:
              if srs_marker not in srs:
                  raise RuntimeError("SRS 8.2 marker missing")
              srs = srs.replace(srs_marker, srs_future + "\n\n" + srs_marker, 1)
          write(srs_path, srs)

          # ------------------------------------------------------------------
          # Roadmap — current compatibility + Future E5/E6/E7
          # ------------------------------------------------------------------
          rm_path = "docs/planning/increment-roadmap.md"
          rm = read(rm_path)
          rm = rm.replace("Formal SRS Baseline v2.8", "Formal SRS Baseline v3.1")

          theme_anchor = "Theme architecture should use shared tokens/components, not four separate applications."
          theme_guard = r'''Theme architecture should use shared tokens/components, not four separate applications.

          ### Future Generative-Experience Compatibility Guardrail

          Increment 5 still implements the retained conventional themes above; it does **not** implement the Future Generative Experience Runtime.

          However, its UI architecture must avoid placing authoritative domain rules only inside theme-specific components. Current themes should reuse shared tokens/primitives/components and invoke stable application/domain actions so a later validated generated surface can compose the same product capabilities without bypassing authorization or business rules.

          Do not add the future Experience DSL engine, AI theme generator, Preview sandbox, or extension runtime in Increment 5 merely to anticipate E6/E7.'''
          if "### Future Generative-Experience Compatibility Guardrail" not in rm:
              if theme_anchor not in rm:
                  raise RuntimeError("Roadmap theme anchor missing")
              rm = rm.replace(theme_anchor, theme_guard, 1)

          foundation_note = r'''Likewise, presentation/application boundaries in current increments must avoid making one specific UI component tree the only safe way to perform a core mutation. Important state-changing behavior should terminate at actor-aware, authorization-aware application/domain boundaries so a future default UI, validated generated experience, or authorized Agent can invoke the same product capability without duplicating domain rules. This is a compatibility constraint only; it does not require building the Future Agent/Experience runtimes early.'''
          i8_marker = "---\n\n# 8. Increment 1 — Identity + Folder/List/Column + Basic Task MVP"
          if foundation_note not in rm:
              if i8_marker not in rm:
                  raise RuntimeError("Roadmap I1 marker missing")
              rm = rm.replace(i8_marker, foundation_note + "\n\n" + i8_marker, 1)

          future_increments = r'''# 24A. Future Increment E5 — Built-in AI Agent Runtime

          ## Goal

          Add a Dotick-operated Agent that can inspect and act on Dotick through explicit User authority without creating a second business-logic path.

          ## Scope

          - authority presets: `Observe`, `Ask`, `Assist`, `Autonomous`;
          - grant lifetimes where applicable: `Once`, `This session`, `Always` until revoked;
          - capability classification and gateway;
          - sensitive/destructive action classification and confirmation policy;
          - revocation and permission inspection;
          - Agent origin in History/Audit;
          - Agent use of the same authorization/domain/application path as ordinary User actions;
          - origin-neutral Undo/recovery for equivalent planning mutations;
          - Agent failure isolation and privacy/context controls.

          ## Non-goals

          - no direct ORM/database mutation tool for the Agent;
          - no authority inferred merely from an AI prompt;
          - no public unrestricted API implied by the built-in Agent.

          ## New / Updated Future Artifacts

          - `AI_AGENT_SPEC.md` — New
          - Architecture — Update
          - Authorization Model — Update
          - Security Design — Update
          - API/capability contracts — Update
          - UI/UX — Update
          - Test Strategy / Agent evaluation suite — Update/New

          ---

          # 24B. Future Increment E6 — Generative Experience Runtime

          ## Goal

          Allow the User to describe and iteratively edit a validated Dotick experience while preserving the stable product kernel.

          ## Scope

          - transformation distance: `Recolor`, `Restyle`, `Transform`, `Reimagine`;
          - declarative Experience Specification/DSL;
          - registered design primitives/components/actions;
          - versioned Experience artifacts;
          - AI generation/edit/repair outside the ordinary interaction loop;
          - deterministic structural/schema validation;
          - required-capability reachability contracts;
          - functional simulation using representative synthetic Dotick state;
          - accessibility validation against the measurable baseline selected for that release;
          - AI UX review after deterministic checks;
          - fully interactive synthetic-data Preview before Apply;
          - protected recovery/default experience and previous-valid-version restore;
          - controlled link/file/package sharing;
          - generated/User-provided/external asset provenance and trust policy;
          - explicit per-device/form-factor adaptation, validation, Preview and Apply; no cross-device auto-activation.

          ## Hard Boundary

          The Experience Runtime does not execute unrestricted AI-generated JavaScript, React/native code, unrestricted CSS, or another arbitrary executable theme payload. Generated presentation maps permitted interactions to registered Dotick capabilities; it does not redefine domain operations.

          ## New / Updated Future Artifacts

          - `GENERATIVE_EXPERIENCE_SPEC.md` — New
          - Experience DSL/schema + versioning artifact — New
          - UI architecture / renderer ADR — New
          - synthetic preview/test-workspace specification — New
          - Architecture — Update
          - UI/UX — Update
          - Security Design — Update
          - Accessibility/Quality specification — Update/New
          - Test Strategy — Update

          ---

          # 24C. Future Increment E7 — Generated Extensions / Personal Productivity Environment

          ## Goal

          Extend Generative Experience with bounded experience-specific state/rules only after the safe presentation runtime is mature.

          ## Scope candidate

          ```text
          Extension State
          Extension Events
          Extension UI
          Extension Rules
          ```

          This phase may support experience-specific progression or other bounded mini-functionality driven by real Dotick events. It must remain sandboxed and must not become an alternate source of truth for core Task/Event/Routine, authorization, Sync, or History semantics.

          Exact extension state/event/rule security model is a mandatory Future Design Gate before implementation.

          ---

          '''
          feature_marker = "# 24. Canonical Feature Coverage Matrix"
          if "# 24A. Future Increment E5" not in rm:
              if feature_marker not in rm:
                  raise RuntimeError("Roadmap feature-matrix marker missing")
              rm = rm.replace(feature_marker, future_increments + feature_marker, 1)

          coverage_anchor = "| four retained themes | 5 |"
          coverage_extra = """| four retained themes | 5 |\n| shared token/component theme foundation compatible with later generated surfaces | 5 guardrail |\n| built-in AI Agent authority profiles | E5 |\n| Agent Once / Session / Always grants, revocation and audit | E5 |\n| Agent uses ordinary domain/authorization/Undo path | architecture guardrail now; E5 runtime |\n| Generative Experience transformation distance | E6 |\n| declarative Experience Specification/DSL | E6 |\n| deterministic capability/structural validation + functional simulation | E6 |\n| interactive synthetic-data Preview before Apply | E6 |\n| explicit cross-device adaptation; no auto-apply | E6 |\n| generated experience sharing/package validation | E6 |\n| bounded generated Extension State/Events/UI/Rules | E7 |"""
          if "| built-in AI Agent authority profiles | E5 |" not in rm:
              if coverage_anchor not in rm:
                  raise RuntimeError("Roadmap coverage theme row missing")
              rm = rm.replace(coverage_anchor, coverage_extra, 1)

          entity_anchor = "| Organization/Tenant | — | E1 |"
          entity_extra = """| Agent Authority Grant/Profile | — | E5 |\n| Experience Specification / validated variant | — | E6 |\n| Extension State / Events / Rules | — | E7 |\n| Organization/Tenant | — | E1 |"""
          if "| Agent Authority Grant/Profile | — | E5 |" not in rm:
              if entity_anchor not in rm:
                  raise RuntimeError("Roadmap entity matrix anchor missing")
              rm = rm.replace(entity_anchor, entity_extra, 1)

          gate_anchor = "| Enterprise SSO SAML/OIDC choice | before E1 |"
          gate_extra = """| Future built-in Agent capability matrix, risk classification, grants/revocation and confirmation UX | before E5 |\n| Experience DSL/versioning, registered primitives/actions, reachability contracts, validation suite and Preview isolation | before E6 |\n| Generative Experience accessibility acceptance baseline and asset provenance/trust policy | before E6 production release |\n| Generated Extension state/event/rule sandbox and integrity/security model | before E7 |\n| Enterprise SSO SAML/OIDC choice | before E1 |"""
          if "| Future built-in Agent capability matrix" not in rm:
              if gate_anchor not in rm:
                  raise RuntimeError("Roadmap gate anchor missing")
              rm = rm.replace(gate_anchor, gate_extra, 1)

          order_anchor = "Future E4\nNative Mobile / OS-specific Capabilities\n```"
          order_extra = """Future E4\nNative Mobile / OS-specific Capabilities\n        ↓\nFuture E5\nBuilt-in AI Agent Runtime\n        ↓\nFuture E6\nGenerative Experience Runtime\n        ↓\nFuture E7\nGenerated Extensions / Personal Productivity Environment\n```"""
          if "Future E7\nGenerated Extensions" not in rm:
              if order_anchor not in rm:
                  raise RuntimeError("Roadmap final-order E4 anchor missing")
              rm = rm.replace(order_anchor, order_extra, 1)

          key_add = r'''26. Future built-in Agent authority is standardized around Observe/Ask/Assist/Autonomous with Once/Session/Always grant lifetimes where applicable; the exact capability matrix remains a Future Design Gate.
          27. Future Agent mutations use the same authorization/domain/History/Undo path as equivalent User operations rather than a privileged AI mutation path.
          28. Future Generative Experience uses Recolor/Restyle/Transform/Reimagine transformation distance and a validated declarative Experience Specification rather than unrestricted generated executable client code.
          29. Generated experiences require deterministic validation, functional simulation, release-appropriate accessibility checks, AI UX review and interactive synthetic-data Preview; cross-device activation requires explicit adaptation and Apply.
          30. Generated Extension State/Events/UI/Rules is intentionally deferred beyond the initial safe Generative Experience Runtime.'''
          section32 = "# 32. What Must Not Happen"
          if "26. Future built-in Agent authority" not in rm:
              if section32 not in rm:
                  raise RuntimeError("Roadmap section 32 marker missing")
              rm = rm.replace(section32, key_add + "\n\n---\n\n" + section32, 1)

          not_happen_anchor = "- Do not bring Enterprise Custom Roles/multi-tenancy into Personal V1 prematurely."
          not_happen_extra = """- Do not bring Enterprise Custom Roles/multi-tenancy into Personal V1 prematurely.\n- Do not move ordinary UI interactions into a continuous LLM request loop when a validated local Experience Runtime can execute them deterministically.\n- Do not execute unrestricted AI-generated JavaScript/React/native code/CSS as a generated theme contract.\n- Do not let a generated experience or Agent bypass ordinary authorization, domain validation, History/Audit, Sync, or Undo semantics.\n- Do not auto-activate a device-specific generated experience on another device/form factor without explicit adaptation, validation, Preview, and Apply.\n- Do not implement the E7 extension engine prematurely merely because the Future concept is known."""
          if "- Do not execute unrestricted AI-generated JavaScript" not in rm:
              if not_happen_anchor not in rm:
                  raise RuntimeError("Roadmap What Must Not Happen anchor missing")
              rm = rm.replace(not_happen_anchor, not_happen_extra, 1)

          write(rm_path, rm)

          # ------------------------------------------------------------------
          # Traceability — no new Personal V1 normative IDs; update baselines
          # ------------------------------------------------------------------
          tm_path = "docs/requirements/traceability-matrix.md"
          tm = read(tm_path)
          tm = tm.replace("**Version:** 2.1", "**Version:** 2.2", 1)
          tm = tm.replace("**Baseline date:** 2026-08-26", "**Baseline date:** 2026-09-18", 1)
          tm = re.sub(r'\*\*Implementation reconciliation:\*\*[^\n]*', "**Implementation reconciliation:** 2026-09-18 — SRS v3.1 adds confirmed Future Agent/Generative Experience direction only; Personal V1 normative requirement IDs remain unchanged.", tm, count=1)
          tm = re.sub(r'\*\*Status:\*\* Reconciled Traceability Baseline for Formal SRS v[^\n]*', "**Status:** Reconciled Traceability Baseline for Formal SRS v3.1", tm, count=1)
          tm = tm.replace("نسخه 2.9", "نسخه 3.1")
          tm = tm.replace("baseline این ماتریس: v2.9", "baseline این ماتریس: v3.1")
          tm = tm.replace("Formal SRS baseline | v2.9، dated 2026-08-26", "Formal SRS baseline | v3.1، dated 2026-09-18")
          tm = tm.replace("SRS v2.9", "SRS v3.1")

          dr_count = len(re.findall(r'^## DR-\d+', read(dr_path), flags=re.MULTILINE))
          tm = re.sub(r'\| Current Decision Register records \| \*\*\d+\*\* \|', f'| Current Decision Register records | **{dr_count}** |', tm, count=1)

          future_note = r'''> **Future-direction trace:** DR-145 and DR-146 are intentionally represented in System Definition §12.4, SRS §8.1.1, Roadmap E5/E6/E7, `docs/design/architecture.md`, and `docs/requirements/future-ai-agent-experience.md`. Because these capabilities are outside Personal V1, they intentionally add **no new Personal V1 normative SRS requirement IDs** in this matrix.'''
          verify_anchor = "Verification روش هر requirement"
          if "**Future-direction trace:** DR-145" not in tm:
              if verify_anchor not in tm:
                  raise RuntimeError("Traceability verification anchor missing")
              tm = tm.replace(verify_anchor, future_note + "\n\n" + verify_anchor, 1)
          write(tm_path, tm)

          # Link the dedicated Future vision to its canonical decisions.
          vision_path = "docs/requirements/future-ai-agent-experience.md"
          vision = read(vision_path)
          if "> **Decision references:** DR-145, DR-146" not in vision:
              vision = vision.replace("> **Scope:** Future capability; **not** a Personal V1 implementation requirement  \n", "> **Scope:** Future capability; **not** a Personal V1 implementation requirement  \n> **Decision references:** DR-145, DR-146  \n", 1)
          write(vision_path, vision)
          PY

      - name: Remove one-shot workflow and commit reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reconcile-future-ai-docs.yml
          git add docs/requirements/system-definition.md \
                  docs/decision-register.md \
                  docs/requirements/srs.md \
                  docs/planning/increment-roadmap.md \
                  docs/requirements/traceability-matrix.md \
                  docs/requirements/future-ai-agent-experience.md
          git diff --cached --check
          git commit -m "docs(ai): reconcile agent and generative experience direction"
          git push origin HEAD:test
