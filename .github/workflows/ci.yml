name: Foundation
on:
  pull_request:
  push:
    branches: [main, codex]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: dotick
          POSTGRES_PASSWORD: ci-database-only
          POSTGRES_DB: dotick_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dotick -d dotick_dev"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DOTICK_ENV: test
      DOTICK_FOUNDATION_ENABLED: '1'
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: dotick_dev
      PGUSER: dotick
      PGPASSWORD: ci-database-only
      DOTICK_DEVELOPMENT_PASSWORD: CI-verification-only-9!
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.9
          python -m uv sync --frozen
          npm ci
          python -c "import os,secrets; open(os.environ['GITHUB_ENV'],'a').write('DJANGO_SECRET_KEY='+secrets.token_urlsafe(64)+'\nDJANGO_JWT_SIGNING_KEY='+secrets.token_urlsafe(64)+'\n')"
      - name: Static checks and traceability
        run: |
          python -m uv run ruff check apps/api scripts
          python -m uv run ruff format --check apps/api scripts
          npm run lint
          npm run format:check
          npm run typecheck
          python scripts/check_traceability.py
      - name: Database, API and time-vector tests
        run: |
          python -m uv run python apps/api/manage.py makemigrations --check --dry-run
          python -m uv run python apps/api/manage.py migrate --noinput
          python -m uv run pytest
          DOTICK_ENV=production DOTICK_FOUNDATION_ENABLED=0 python -m uv run python apps/api/manage.py check --deploy --fail-level WARNING
      - name: Client tests and build
        run: |
          npm test
          npm run build
      - name: Desktop and mobile walking skeleton
        run: |
          npx playwright install --with-deps chromium
          python -m uv run python apps/api/manage.py create_developer
          npm run test:e2e
      - name: Dependency audit
        run: |
          python -m uv run pip-audit
          npm audit --audit-level=high
      - name: Scan committed changes for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact --no-banner --log-opts=-1
      - name: Build deployment images
        run: |
          docker build -f apps/api/Dockerfile -t dotick-api:ci .
          docker build -f apps/client/Dockerfile -t dotick-web:ci .
