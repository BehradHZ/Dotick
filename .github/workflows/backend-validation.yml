name: Backend Validation

on:
  push:
    branches: [test]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: dotick
          POSTGRES_PASSWORD: ci-database-only
          POSTGRES_DB: dotick_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dotick -d dotick_dev"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DOTICK_ENV: test
      DOTICK_FOUNDATION_ENABLED: '1'
      DJANGO_DEBUG: '0'
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DJANGO_CORS_ORIGINS: http://127.0.0.1:8081,http://localhost:8081
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: dotick_dev
      PGUSER: dotick
      PGPASSWORD: ci-database-only
      DOTICK_DEVELOPMENT_PASSWORD: CI-verification-only-9!
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.12.9
          python -m uv sync --frozen
          python -c "import os,secrets; open(os.environ['GITHUB_ENV'],'a').write('DJANGO_SECRET_KEY='+secrets.token_urlsafe(64)+'\n')"
      - name: Python lint
        run: python -m uv run ruff check apps/api scripts
      - name: Traceability check
        run: python scripts/check_traceability.py
      - name: Migration and schema drift checks
        run: |
          python -m uv run python apps/api/manage.py makemigrations --check --dry-run
          python -m uv run python apps/api/manage.py migrate --noinput
          python -m uv run python apps/api/manage.py showmigrations
          python -m uv run python scripts/check_migrations.py
          python -m uv run python scripts/verify_clean_database.py
      - name: Backend and golden-time tests
        run: |
          python -m uv run python apps/api/manage.py test dotick
          python -m uv run pytest
      - name: Django production deployment check
        env:
          DOTICK_ENV: production
          DOTICK_FOUNDATION_ENABLED: '0'
        run: python -m uv run python apps/api/manage.py check --deploy --fail-level WARNING
