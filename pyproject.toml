[project]
name = "dotick"
version = "0.1.0"
description = "Dotick API and engineering foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "argon2-cffi==25.1.0",
    "django==5.2.17",
    "django-cors-headers==4.9.0",
    "djangorestframework==3.18.0",
    "psycopg[binary]==3.3.5",
    "python-dotenv==1.2.3",
    "uvicorn==0.52.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["archive", "resources", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.16.6",
]
