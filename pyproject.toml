[project]
name = "dotick"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django==5.2.17",
    "djangorestframework==3.18.0",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "ruff==0.16.6",
]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["node_modules"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

